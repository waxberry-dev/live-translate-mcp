<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Menlo', 'Consolas', 'Monaco', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Window shadow -->
  <rect x="10" y="10" width="700" height="380" rx="10" ry="10" fill="#00000030"/>

  <!-- Window background -->
  <rect x="6" y="6" width="700" height="380" rx="10" ry="10" fill="#1e1e2e"/>

  <!-- Title bar -->
  <rect x="6" y="6" width="700" height="36" rx="10" ry="10" fill="#313244"/>
  <rect x="6" y="24" width="700" height="18" fill="#313244"/>

  <!-- Traffic lights -->
  <circle cx="30" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="6" fill="#febc2e"/>
  <circle cx="70" cy="24" r="6" fill="#28c840"/>

  <!-- Logo + Title -->
  <image href="logo.png" x="328" y="10" width="18" height="18" preserveAspectRatio="xMidYMid meet"/>
  <text x="352" y="29" text-anchor="middle" class="sans" font-size="12" fill="#cdd6f4" font-weight="500">live-translate-mcp · Claude Code demo</text>

  <!-- Prompt line -->
  <text x="28" y="68" class="mono" font-size="13" fill="#89b4fa">❯</text>
  <text x="44" y="68" class="mono" font-size="13" fill="#cdd6f4">Translate this for me: /tmp/hello-english.wav</text>

  <!-- Divider -->
  <line x1="28" y1="82" x2="692" y2="82" stroke="#45475a" stroke-width="1"/>

  <!-- Tool call header -->
  <rect x="28" y="92" width="8" height="62" rx="2" fill="#89b4fa" opacity="0.6"/>
  <text x="44" y="107" class="mono" font-size="12" fill="#89b4fa" font-weight="600">Tool: translate_file</text>
  <text x="44" y="125" class="mono" font-size="12" fill="#6c7086">  file_path: /tmp/hello-english.wav</text>

  <!-- ASR result -->
  <text x="44" y="145" class="mono" font-size="12" fill="#a6e3a1">  ✓ Transcribed</text>
  <text x="160" y="145" class="mono" font-size="12" fill="#cdd6f4">"Hello, how are you today?"</text>
  <text x="44" y="162" class="mono" font-size="12" fill="#6c7086">    Language detected: English → translating to Mandarin</text>

  <!-- Translation result -->
  <line x1="28" y1="176" x2="692" y2="176" stroke="#45475a" stroke-width="0.5" stroke-dasharray="4,4"/>

  <text x="28" y="198" class="mono" font-size="13" fill="#cba6f7" font-weight="600">Original (en)</text>
  <text x="28" y="218" class="mono" font-size="13" fill="#cdd6f4">  Hello, how are you today?</text>

  <text x="28" y="248" class="mono" font-size="13" fill="#f38ba8" font-weight="600">Translation (zh)</text>
  <text x="28" y="268" class="mono" font-size="13" fill="#cdd6f4">  你好，今天怎么样？</text>

  <!-- Output path -->
  <line x1="28" y1="283" x2="692" y2="283" stroke="#45475a" stroke-width="0.5" stroke-dasharray="4,4"/>

  <text x="28" y="303" class="mono" font-size="12" fill="#a6e3a1">✓ Saved</text>
  <text x="80" y="303" class="mono" font-size="12" fill="#6c7086">/tmp/hello-english_translated.wav</text>
  <text x="28" y="321" class="mono" font-size="12" fill="#a6e3a1">✓ Playing translation...</text>

  <!-- Footer badge row -->
  <rect x="28" y="345" width="100" height="22" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="78" y="360" text-anchor="middle" class="mono" font-size="11" fill="#89b4fa">Whisper ASR</text>

  <text x="138" y="360" class="sans" font-size="11" fill="#45475a">→</text>

  <rect x="152" y="345" width="110" height="22" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="207" y="360" text-anchor="middle" class="mono" font-size="11" fill="#cba6f7">Claude Opus 4.8</text>

  <text x="272" y="360" class="sans" font-size="11" fill="#45475a">→</text>

  <rect x="286" y="345" width="90" height="22" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="331" y="360" text-anchor="middle" class="mono" font-size="11" fill="#a6e3a1">Piper TTS</text>

  <text x="400" y="360" class="sans" font-size="11" fill="#45475a">·</text>

  <text x="414" y="360" class="sans" font-size="11" fill="#6c7086">ASR &amp; TTS run locally · only text sent to API</text>
</svg>
