<svg xmlns="http://www.w3.org/2000/svg" width="900" height="446" viewBox="0 0 900 446">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Menlo', 'Consolas', 'Monaco', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', sans-serif; }
    </style>
    <clipPath id="right-win-clip">
      <rect x="440" y="8" width="452" height="416" rx="10"/>
    </clipPath>
  </defs>

  <!-- ===== LEFT: Claude Code ===== -->
  <rect x="12" y="12" width="418" height="416" rx="10" fill="#00000022"/>
  <rect x="8" y="8" width="418" height="416" rx="10" fill="#1e1e2e"/>
  <rect x="8" y="8" width="418" height="34" rx="10" fill="#313244"/>
  <rect x="8" y="26" width="418" height="16" fill="#313244"/>
  <circle cx="28" cy="25" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="25" r="6" fill="#febc2e"/>
  <circle cx="68" cy="25" r="6" fill="#28c840"/>
  <text x="217" y="30" text-anchor="middle" class="sans" font-size="11" fill="#cdd6f4">Claude Code</text>

  <!-- Prompt -->
  <text x="22" y="62" class="mono" font-size="12" fill="#89b4fa">❯</text>
  <text x="36" y="62" class="mono" font-size="12" fill="#cdd6f4">Translate /tmp/hello-english.wav</text>

  <line x1="22" y1="74" x2="414" y2="74" stroke="#45475a" stroke-width="1"/>

  <!-- Tool call block -->
  <rect x="22" y="84" width="6" height="74" rx="2" fill="#89b4fa" opacity="0.6"/>
  <text x="36" y="99" class="mono" font-size="11" fill="#89b4fa" font-weight="600">Tool: translate_file</text>
  <text x="36" y="115" class="mono" font-size="11" fill="#6c7086">  file_path: /tmp/hello-english.wav</text>
  <text x="36" y="131" class="mono" font-size="11" fill="#a6e3a1">  ✓ Transcribed</text>
  <text x="134" y="131" class="mono" font-size="11" fill="#cdd6f4">"Hello, how are you today?"</text>
  <text x="36" y="148" class="mono" font-size="11" fill="#6c7086">  Language: English → Mandarin</text>

  <line x1="22" y1="163" x2="414" y2="163" stroke="#45475a" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="22" y="180" class="mono" font-size="12" fill="#cba6f7" font-weight="600">Original (en)</text>
  <text x="22" y="198" class="mono" font-size="12" fill="#cdd6f4">  Hello, how are you today?</text>

  <text x="22" y="222" class="mono" font-size="12" fill="#f38ba8" font-weight="600">Translation (zh)</text>
  <text x="22" y="240" class="mono" font-size="12" fill="#cdd6f4">  你好，今天怎么样？</text>

  <line x1="22" y1="255" x2="414" y2="255" stroke="#45475a" stroke-width="0.5" stroke-dasharray="4,3"/>

  <text x="22" y="273" class="mono" font-size="11" fill="#a6e3a1">✓ Saved</text>
  <text x="72" y="273" class="mono" font-size="11" fill="#6c7086">/tmp/hello-english_translated.wav</text>
  <text x="22" y="289" class="mono" font-size="11" fill="#a6e3a1">✓ Playing translation...</text>

  <!-- Footer badges -->
  <rect x="22" y="314" width="96" height="20" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="70" y="328" text-anchor="middle" class="mono" font-size="10" fill="#89b4fa">Whisper ASR</text>
  <text x="126" y="328" class="sans" font-size="10" fill="#45475a">→</text>
  <rect x="136" y="314" width="108" height="20" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="190" y="328" text-anchor="middle" class="mono" font-size="10" fill="#cba6f7">Claude Opus 4.8</text>
  <text x="252" y="328" class="sans" font-size="10" fill="#45475a">→</text>
  <rect x="262" y="314" width="86" height="20" rx="4" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="305" y="328" text-anchor="middle" class="mono" font-size="10" fill="#a6e3a1">Piper TTS</text>
  <text x="22" y="352" class="sans" font-size="10" fill="#6c7086">ASR &amp; TTS run locally · only text sent to API</text>

  <!-- Label -->
  <text x="217" y="440" text-anchor="middle" class="sans" font-size="11" fill="#6c7086">Claude Code</text>

  <!-- ===== RIGHT: Claude Desktop ===== -->
  <rect x="444" y="12" width="452" height="416" rx="10" fill="#00000022"/>
  <rect x="440" y="8" width="452" height="416" rx="10" fill="#1c1c1e"/>

  <!-- Title bar -->
  <rect x="440" y="8" width="452" height="34" rx="10" fill="#2c2c2e"/>
  <rect x="440" y="26" width="452" height="16" fill="#2c2c2e"/>
  <circle cx="460" cy="25" r="6" fill="#ff5f57"/>
  <circle cx="480" cy="25" r="6" fill="#febc2e"/>
  <circle cx="500" cy="25" r="6" fill="#28c840"/>
  <text x="666" y="30" text-anchor="middle" class="sans" font-size="11" fill="#ebebf5">Claude</text>

  <!-- Sidebar (clipped to window shape) -->
  <rect x="440" y="42" width="108" height="382" fill="#242426" clip-path="url(#right-win-clip)"/>
  <line x1="548" y1="42" x2="548" y2="424" stroke="#3a3a3c" stroke-width="1"/>

  <!-- Sidebar content -->
  <text x="452" y="62" class="sans" font-size="9" fill="#636366" font-weight="600">RECENTS</text>
  <rect x="444" y="68" width="100" height="36" rx="6" fill="#3a3a3c"/>
  <text x="454" y="83" class="sans" font-size="10" fill="#ebebf5" font-weight="500">live-translate</text>
  <text x="454" y="97" class="sans" font-size="9" fill="#8e8e93">hello-english.wav</text>

  <!-- Chat area: x=554 to x=884 (330px) -->

  <!-- User bubble -->
  <rect x="672" y="50" width="202" height="46" rx="18" fill="#4a3f6b"/>
  <text x="773" y="68" text-anchor="middle" class="sans" font-size="10" fill="#ebebf5">Translate this file for me:</text>
  <text x="773" y="85" text-anchor="middle" class="mono" font-size="10" fill="#d4bbff">/tmp/hello-english.wav</text>

  <!-- Tool block -->
  <rect x="557" y="110" width="316" height="50" rx="8" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1"/>
  <text x="570" y="128" class="mono" font-size="10" fill="#8e8e93">▶  Used tool</text>
  <text x="626" y="128" class="mono" font-size="10" fill="#89b4fa">translate_file</text>
  <text x="570" y="148" class="mono" font-size="10" fill="#a6e3a1">  ✓ Transcribed · ✓ Translated · ✓ Synthesised</text>

  <!-- Claude response -->
  <text x="557" y="186" class="sans" font-size="12" fill="#ebebf5">Here's the translation:</text>

  <!-- Result card EN -->
  <rect x="557" y="198" width="316" height="54" rx="8" fill="#2c2c2e"/>
  <text x="570" y="215" class="sans" font-size="9" fill="#8e8e93" font-weight="600">ORIGINAL · ENGLISH</text>
  <text x="570" y="233" class="sans" font-size="12" fill="#ebebf5">Hello, how are you today?</text>
  <text x="570" y="245" class="sans" font-size="9" fill="#636366">Confidence: 0.97</text>

  <!-- Result card ZH -->
  <rect x="557" y="262" width="316" height="54" rx="8" fill="#2c2c2e"/>
  <text x="570" y="279" class="sans" font-size="9" fill="#cba6f7" font-weight="600">TRANSLATION · MANDARIN</text>
  <text x="570" y="298" class="sans" font-size="13" fill="#ebebf5">你好，今天怎么样？</text>
  <text x="570" y="310" class="sans" font-size="9" fill="#636366">via Claude Opus 4.8</text>

  <!-- Saved + playing -->
  <text x="557" y="336" class="sans" font-size="10" fill="#8e8e93">Saved as</text>
  <text x="602" y="336" class="mono" font-size="10" fill="#6c7086">/tmp/hello-english_translated.wav</text>
  <text x="557" y="354" class="sans" font-size="10" fill="#a6e3a1">▶ Playing translation...</text>

  <!-- Input bar -->
  <rect x="557" y="398" width="316" height="26" rx="13" fill="#3a3a3c"/>
  <text x="572" y="415" class="sans" font-size="10" fill="#636366">Message Claude...</text>

  <!-- Label -->
  <text x="666" y="440" text-anchor="middle" class="sans" font-size="11" fill="#6c7086">Claude Desktop</text>
</svg>
